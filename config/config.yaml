# Zendesk Export Settings
export:
    subdomain: null # override from .env if needed
    start_time: null # ISO datetime, e.g. "2024-01-01T00:00:00Z"
    end_time: null # ISO datetime — stop when tickets pass this date
    channel_id: "sunshine_conversations_facebook_messenger" # Zendesk via channel ID
    max_retries: 5 # rate-limit retries
    retry_backoff_base: 2 # exponential backoff multiplier (seconds)
    max_pages: 5000 # safety limit (total API calls)
    progress_interval: 50 # log progress every N operations
    comment_concurrency: 5 # parallel comment fetches per ticket
    output_dir: "data/raw"
    checkpoint_file: "data/export_cursor.json" # resume cursor

# Dataset Settings
dataset:
    input_dir: "data/raw"
    output_dir: "data"
    train_ratio: 0.9 # 90% train, 10% valid
    shuffle_seed: 42
    agent_names: # known support agent names (Sunshine Conversations)
        - "Kissadakron Duangparsart"
        - "Surachai Uthaisamairath"
        - "Support Team"
    clean_attachments: true # strip attachment metadata (URL/Type/Size)
    clean_urls: false # replace long URLs with [link]
    dedupe_canned: true # remove repeated canned closing messages
    dedupe_exact: true # cross-conversation exact duplicate removal
    max_duplicate_count: 3 # keep max N copies of identical messages
    dedupe_sentences: true # sentence-level dedup across conversations
    filter_sentences: # exact sentences to filter (populate after analysis)
        - "หากพี่มนุษย์ต้องการสอบถามข้อมูลเพิ่มเติม สามารถฝากข้อความไว้ได้ตลอดเวลาและทางทีมงานจะเร่งติดต่อกลับในเวลาทำการ จันทร์-ศุกร์ 9:00-18:00น."
        - "ต้องขออภัยที่มาตอบช้าด้วยนะฮะเนื่องจากเวลาทำการของทีมงานจะเป็นวันจันทร์-ศุกร์ 09. 00-18. 00 (ยกเว้นวันหยุด) น่ะฮะ"
    # Run `uv run python run_prepare.py --analyze` to discover candidates
    clean_fillers: true # strip trailing filler particles (ครับ/ค่ะ/ฮะ/etc)
    drop_filler_only: true # drop messages that are nothing but filler words
    min_message_length: 3 # skip messages shorter than N chars
    redact_pii: true # redact phone numbers and emails
    pii_safe_patterns: # patterns to keep (not redacted)
        - "support@meowjot.com"
    system_prompt: |
        You are a helpful, polite customer support agent for a Thai company.
        Follow the company's support SOP. Ask for missing information before
        troubleshooting. Escalate when appropriate. Respond in Thai.

# Training Settings
training:
    base_model: "unsloth/Qwen2.5-1.5B-Instruct"
    max_seq_length: 2048
    load_in_4bit: true
    lora_r: 16
    lora_alpha: 16
    lora_dropout: 0.0
    target_modules:
        [
            "q_proj",
            "k_proj",
            "v_proj",
            "o_proj",
            "gate_proj",
            "up_proj",
            "down_proj",
        ]
    use_rslora: false
    learning_rate: 2.0e-4
    num_epochs: 3
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 4
    warmup_steps: 5
    logging_steps: 1
    save_steps: 100
    output_dir: "adapters"
    resume_from_checkpoint: null

# Inference Settings
inference:
    adapter_dir: "adapters"
    base_model: "unsloth/Qwen2.5-1.5B-Instruct"
    max_new_tokens: 512
    temperature: 0.7
    top_p: 0.9
