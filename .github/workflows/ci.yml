name: CI

# Gate every change to main through automated tests.
# Combined with branch protection (GitHub Pro / public repo), this blocks
# merges that break the test suite.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra test --extra lint

      - name: Lint
        run: uv run ruff check src/

      - name: Run tests with coverage
        run: uv run python -m pytest tests/ -v --cov=src --cov-report=term


