name: CI

# Gate every change to main through automated tests.
# Combined with branch protection (GitHub Pro / public repo), this blocks
# merges that break the test suite.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: Syntax check
        run: |
          uv run python -c "import ast, glob; [ast.parse(open(f).read()) for f in glob.glob('src/**/*.py', recursive=True)]"
          echo "Syntax OK"

      - name: Run tests
        run: uv run python -m pytest tests/ -v
