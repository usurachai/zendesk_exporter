name: README Sync Check

on:
  pull_request:
    paths:
      - 'config/config.yaml'
      - 'src/**/*.py'
      - 'run_*.py'

jobs:
  check-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check README was updated
        run: |
          if git diff --name-only origin/main...HEAD | grep -qE '(config/config\.yaml|src/.*\.py|run_.*\.py)' ; then
            if ! git diff --name-only origin/main...HEAD | grep -q README.md ; then
              echo "::warning::Config or source files changed but README.md was not updated."
              echo "Please update README.md to reflect your changes."
            fi
          fi
          echo "README sync check complete."
