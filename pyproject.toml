[project]
name = "zendesk_exporter"
version = "0.1.0"
description = "Export Zendesk tickets and prepare fine-tuning datasets"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
train = [
    "unsloth>=2024.12.0",
    "torch>=2.4.0",
    "transformers>=4.46.0",
    "datasets>=2.20.0",
    "accelerate>=0.33.0",
    "peft>=0.13.0",
    "trl>=0.11.0",
]
test = [
    "pytest>=9.0.0",
    "pytest-cov>=6.0.0",
]
lint = [
    "ruff>=0.5.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "S", "W"]
